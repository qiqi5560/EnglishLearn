server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: english-learn
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:data/app.db
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

# 业务配置
app:
  jwt:
    secret: dev-secret-change-me-in-production
    expire-minutes: 10080
  cors-origins: http://localhost:5173,http://127.0.0.1:5173
  sms:
    mock-code: "123456"

# LLM 提供方：mock | ollama
llm:
  provider: ollama
  ollama:
    base-url: http://127.0.0.1:11434
    model: qwen2.5:7b-instruct