server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: english-learn
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:data/app.db
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

# Application config (keep this file ASCII-only: a non-UTF-8 IDE charset corrupts it)
app:
  jwt:
    secret: dev-secret-change-me-in-production
    expire-minutes: 10080
  # Allow any port on localhost / 127.0.0.1, so a changing vite dev port never causes CORS 403
  cors-origins: http://localhost:[*],http://127.0.0.1:[*]
  sms:
    mock-code: "123456"

# LLM provider: mock | ollama
llm:
  provider: ollama
  ollama:
    base-url: http://172.20.6.147:11434
    model: qwen2.5:7b-instruct
